| L4 再生铝 | 1 | 8 | 9 |
| L5 铝合金 | 22 | 1 | 23 |
| L6 终端需求 | **13** | **13** | **26** |
| L7 全球平衡 | **6** | **3** | **9** |
| L8 内外盘联动 / 公司 | **8** | **17** | **25** |
| L9 政策宏观 | 0 | 10 | 10 |
| L10 金融市场 | 1 | 11 | 12 |
| L11 事件日历 | 0 | 11 | 11 |
| L12 衍生指标 | 6 | 8 | 14 |
| **合计** | **178** | **100** | **278** |
</script>
</head>
<body>

<div class="header">
  <h1>🗺️ 铝产业看板 - 数据维度框架 v0.1</h1>
  <div class="sub">基于 铝产业链数据.xlsx (44 sheet) + 公开数据补充 · 244 个细项指标</div>
</div>

<div class="toolbar">
  <input id="search" type="text" placeholder="🔍 搜索指标 (例如: 电解铝、SHFE、绿电)..." />
  <span class="stat" id="stat">总计 244 项 · 🟢 已有 144 · 🔴 缺失 98</span>
</div>

<div class="legend">
  <div class="legend-item"><span class="legend-dot green"></span>🟢 Excel 已有</div>
  <div class="legend-item"><span class="legend-dot yellow"></span>🟡 部分覆盖</div>
  <div class="legend-item"><span class="legend-dot red"></span>🔴 缺失需补</div>
  <div class="legend-item"><span class="legend-dot gray"></span>⚪ 待校验</div>
  <div class="legend-item"><span class="legend-dot blue"></span>★ 核心层</div>
</div>

<div id="stats-area"></div>
<div class="container">
  <div id="tree"></div>
</div>

<script>
// ============= Markdown → 树形结构解析 =============
function parseMarkdown(md) {
  const lines = md.split('\n');
  const root = { name: 'root', level: -1, children: [] };
  const stack = [root];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!line.trim() || line.trim().startsWith('>')) continue;
    // heading: 2 个以上 # 开头
    const m = line.match(/^(#{1,6})\s+(.*?)\s*$/);
    if (!m) continue;
    const level = m[1].length;
    let name = m[2];
    // 清除引用 [file] 之类的长尾
    name = name.replace(/\s*\[.*?\]\([^)]*\)/g, '').trim();

    const node = { name, level, children: [] };
    // 找父节点
    while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
    stack[stack.length - 1].children.push(node);
    stack.push(node);
  }
  return root;
}

// ============= 颜色与样式 =============
function classifyNode(name) {
  const tags = [];
  let cssClass = 'lvl-leaf';
  if (name.includes('🟢')) tags.push('green');
  if (name.includes('🟡')) tags.push('yellow');
  if (name.includes('🔴')) tags.push('red');
  if (name.includes('⚪')) tags.push('gray');
  if (name.includes('★')) tags.push('star');

  // 顶层
  if (/^L\d\s/.test(name)) cssClass = 'lvl-L';
  else if (name.match(/^L\d\.\d/)) cssClass = 'lvl-section';
  else if (name.match(/^[A-Z]/)) cssClass = 'lvl-group';

  return { tags, cssClass };
}

// ============= 渲染 =============
function renderNode(node, depth) {
  const { tags, cssClass } = classifyNode(node.name);
  const tagClasses = tags.map(t => 'has-' + t).join(' ');
  const wrapper = document.createElement('div');
  wrapper.className = 'node';

  const content = document.createElement('div');
  content.className = 'node-content ' + cssClass + ' ' + tagClasses;

  const hasChildren = node.children && node.children.length > 0;
  const toggle = document.createElement('span');
  toggle.className = 'toggle' + (depth >= 3 ? ' collapsed' : '');
  toggle.textContent = hasChildren ? '▼' : '·';
  content.appendChild(toggle);

  const text = document.createElement('span');
  text.className = 'node-text';
  // 清除 emoji 用于显示（保留用于分类，但显示也可保留）
  text.textContent = node.name;
  content.appendChild(text);

  wrapper.appendChild(content);

  if (hasChildren) {
    const children = document.createElement('div');
    children.className = 'children' + (depth >= 3 ? ' hidden' : '');
    node.children.forEach(c => children.appendChild(renderNode(c, depth + 1)));
    wrapper.appendChild(children);

    content.onclick = () => {
      toggle.classList.toggle('collapsed');
      children.classList.toggle('hidden');
    };
  } else {
    toggle.style.visibility = 'hidden';
    content.onclick = () => content.style.background = '#f1f5f9';
    setTimeout(() => content.style.background = '', 150);
  }

  return wrapper;
}

// ============= 统计 =============
function countNodes(node) {
  let total = 0, green = 0, red = 0, yellow = 0, gray = 0, star = 0;
  const walk = (n) => {
    if (n.name !== 'root') {
      total++;
      if (n.name.includes('🟢')) green++;
      if (n.name.includes('🔴')) red++;
      if (n.name.includes('🟡')) yellow++;
      if (n.name.includes('⚪')) gray++;
      if (n.name.includes('★')) star++;
    }
    n.children?.forEach(walk);
  };
  walk(node);
  return { total, green, red, yellow, gray, star };
}

// ============= 搜索 =============
function highlight(search) {
  const tree = document.getElementById('tree');
  const all = tree.querySelectorAll('.node-content');
  const term = search.trim().toLowerCase();
  if (!term) {
    all.forEach(n => n.style.background = '');
    // 恢复默认折叠状态（depth>=3 折叠）
    tree.querySelectorAll('.children').forEach((c, i) => {
      const parent = c.parentElement;
      const depth = (parent.closest('.children')?.closest('.node') ? 1 : 0) + 1;
      // 简单恢复
    });
    return;
  }
  let firstMatch = null;
  all.forEach(n => {
    const text = n.textContent.toLowerCase();
    if (text.includes(term)) {
      n.style.background = '#fef3c7';
      if (!firstMatch) firstMatch = n;
      // 展开所有祖先
      let p = n.parentElement;
      while (p && p.id !== 'tree') {
        if (p.classList.contains('children') && p.classList.contains('hidden')) {
          p.classList.remove('hidden');
          const toggle = p.parentElement.querySelector('.toggle');
          if (toggle) toggle.classList.remove('collapsed');
        }
        p = p.parentElement;
      }
    } else {
      n.style.background = '';
    }
  });
  if (firstMatch) firstMatch.scrollIntoView({ block: 'center' });
}

// ============= 主流程 =============
async function main() {
  const tree = document.getElementById('tree');
  try {
    // 优先用内联源（自包含版），失败再回退到同目录 .md（开发态）
    const inlineEl = document.getElementById('md-source');
    let md;
    if (inlineEl && inlineEl.textContent.trim()) {
      md = inlineEl.textContent;
    } else {
      const r = await fetch('思维导图.md');
      if (!r.ok) throw new Error('HTTP ' + r.status + ' (请确认通过 node start-server.js 启动服务)');
      md = await r.text();
    }
    const root = parseMarkdown(md);
    const stats = countNodes(root);

    // 渲染统计
    const statsArea = document.getElementById('stats-area');
    statsArea.innerHTML = `
      <div class="container" style="padding-bottom:0">
        <div class="stats">
          <div class="stat-card"><div class="label">总指标项</div><div class="value">${stats.total}</div></div>
          <div class="stat-card green"><div class="label">🟢 Excel 已有</div><div class="value">${stats.green}</div></div>
          <div class="stat-card red"><div class="label">🔴 缺失需补</div><div class="value">${stats.red}</div></div>
          <div class="stat-card yellow"><div class="label">🟡 部分覆盖</div><div class="value">${stats.yellow}</div></div>
          <div class="stat-card blue"><div class="label">★ 核心层</div><div class="value">${stats.star}</div></div>
        </div>
        <div class="info">
          <b>💡 使用说明：</b>点击节点展开/折叠 · 🔍 搜索框支持指标名模糊匹配 · 颜色图例在顶部
        </div>
      </div>
    `;

    // 渲染树
    root.children.forEach(c => tree.appendChild(renderNode(c, 0)));

    // 搜索
    document.getElementById('search').oninput = (e) => highlight(e.target.value);

    // 更新顶部统计
    document.getElementById('stat').textContent =
      `总计 ${stats.total} 项 · 🟢 已有 ${stats.green} · 🔴 缺失 ${stats.red} · 🟡 部分 ${stats.yellow}`;
  } catch (e) {
    tree.innerHTML = `<div class="errbox">
      <b>❌ 加载失败：</b> ${e.message}<br><br>
      <b>请确认：</b><br>
      1. 该文件应为自包含单文件版；若为源码版，请在 <code>data-framework/</code> 目录下执行 <code>node start-server.js</code><br>
      2. 浏览器打开 <code>http://localhost:8765/</code><br>
      3. 不要直接双击 HTML（file:// 协议下 fetch 受限）
    </div>`;
  }
}

main();
</script>
</body>
</html>
